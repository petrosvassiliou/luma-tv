[package]
name = "luma-tv-native"
version = "0.7.0-beta.2"
description = "Luma TV (app.lumatv.client) — Tauri v2 Native Playback & CORS-Free Stream Bridge"
authors = ["Luma TV Architecture Team"]
edition = "2021"

[lib]
name = "luma_tv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "stream"] }
tokio = { version = "1", features = ["process", "sync", "rt-multi-thread", "net", "time"] }
url = "2"
