name: Release Native Builds (macOS Liquid Glass & Android M3)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-macos:
    name: Build macOS Universal (.dmg & .app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust stable (Apple Silicon + Intel targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend & Tauri CLI dependencies
        run: npm install --no-audit --no-fund

      - name: Build Universal macOS App & DMG (app.lumatv.client)
        run: npx tauri build --target universal-apple-darwin

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luma-macOS-Universal-DMG
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

      - name: Attach macOS DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --title "Luma TV $TAG" --notes "Automated multi-platform release."
          gh release upload "$TAG" src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg --clobber

  release-android-chromeos:
    name: Build Android & Chromebook (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android NDK & Platform SDK via preinstalled sdkmanager
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "ndk;27.0.12077973" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Rust stable + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install frontend & Tauri CLI dependencies
        run: npm install --no-audit --no-fund

      - name: Initialize & Build Installable Android/Chromebook APK (app.lumatv.client)
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: |
          npx tauri android init
          npx tauri android build --apk --debug

      - name: Rename installable APK artifact
        run: |
          APK_PATH=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          cp "$APK_PATH" ./Luma-TV-Android-Universal.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luma-Android-Universal-APK
          path: ./Luma-TV-Android-Universal.apk

      - name: Attach Android APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --title "Luma TV $TAG" --notes "Automated multi-platform release."
          gh release upload "$TAG" ./Luma-TV-Android-Universal.apk --clobber
