name: Release Native Builds (macOS Liquid Glass & Android M3)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-macos:
    name: Build macOS Universal (.dmg + Ed25519 In-App Updater)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust stable (Apple Silicon + Intel targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend & Tauri CLI dependencies
        run: npm install --no-audit --no-fund

      - name: Build Universal macOS App, DMG & Signed Updater Bundle (app.lumatv.client)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build --target universal-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            npx tauri build --target universal-apple-darwin
          fi

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luma-macOS-Universal-DMG
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

      - name: Generate latest.json & Attach macOS DMG + Signed Updater Bundle to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          export TAG
          if [[ "$TAG" == *-* ]]; then
            REL_FLAG="--prerelease"
          else
            REL_FLAG="--latest"
          fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" $REL_FLAG --title "Luma TV $TAG" --notes "Automated multi-platform release."
          gh release upload "$TAG" src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg --clobber

          TAR_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/Luma.app.tar.gz"
          SIG_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/Luma.app.tar.gz.sig"
          if [ -f "$TAR_PATH" ] && [ -f "$SIG_PATH" ]; then
            node -e '
              const fs = require("fs");
              const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
              const sig = fs.readFileSync("src-tauri/target/universal-apple-darwin/release/bundle/macos/Luma.app.tar.gz.sig", "utf8").trim();
              const url = `https://github.com/${process.env.REPO}/releases/download/${process.env.TAG}/Luma.app.tar.gz`;
              const manifest = {
                version: pkg.version,
                notes: `Luma TV ${process.env.TAG} In-App Update`,
                pub_date: new Date().toISOString(),
                platforms: {
                  "darwin-aarch64": { signature: sig, url },
                  "darwin-x86_64": { signature: sig, url },
                  "darwin-universal": { signature: sig, url }
                }
              };
              fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2));
            '
            gh release upload "$TAG" "$TAR_PATH" "$SIG_PATH" ./latest.json --clobber
          fi

  release-android-chromeos:
    name: Build Android & Chromebook (.apk · 4-ABI Universal + Play Protect V1/V2/V3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java 21 (required by AGP 9 / Gradle 9)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android NDK, Build-Tools & Stable Platform SDK (35 & 36)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "ndk;27.0.12077973" "build-tools;35.0.0" "platforms;android-35" "platforms;android-36"
          yes | "$SDKM" --licenses >/dev/null || true

      - name: Setup Rust stable + all 4 Android & Chromebook ABIs (64-bit & 32-bit)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install frontend & Tauri CLI dependencies
        run: npm install --no-audit --no-fund

      - name: Initialize, Patch Chromebook Manifest/SDK & Sign 4-ABI Universal APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          npx tauri android init

          # Patch generated Gradle, AndroidManifest.xml, MainActivity.kt (immersive fullscreen bridge),
          # and ProGuard rules for Googlebook / Chromebook ARCVM, Android TV & Android phones/tablets
          node ./scripts/patch-android-chromeos.cjs

          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            # Build ALL 4 ABIs (aarch64, armv7, x86_64, i686) so both 64-bit and 32-bit ChromeOS ARC/ARCVM containers match
            npx tauri android build --apk
            RAW_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*universal*release*.apk" | head -n 1)
            if [ -z "$RAW_APK" ]; then
              RAW_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" | head -n 1)
            fi

            printf "%s" "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/luma-release.p12
            ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
            APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

            "$ZIPALIGN" -p -f 4 "$RAW_APK" ./Luma-TV-Aligned.apk
            "$APKSIGNER" sign \
              --ks /tmp/luma-release.p12 \
              --ks-type PKCS12 \
              --ks-key-alias "${ANDROID_KEY_ALIAS:-luma-release}" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --key-pass env:ANDROID_KEY_PASSWORD \
              --min-sdk-version 24 \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out ./Luma-TV-Android-Universal.apk \
              ./Luma-TV-Aligned.apk
            rm -f /tmp/luma-release.p12 ./Luma-TV-Aligned.apk
            "$APKSIGNER" verify --verbose ./Luma-TV-Android-Universal.apk
          else
            npx tauri android build --apk --debug
            APK_PATH=$(find src-tauri/gen/android/app/build/outputs/apk -name "*universal*.apk" | head -n 1)
            if [ -z "$APK_PATH" ]; then
              APK_PATH=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
            fi
            cp "$APK_PATH" ./Luma-TV-Android-Universal.apk
          fi

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luma-Android-Universal-APK
          path: ./Luma-TV-Android-Universal.apk

      - name: Attach Android APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == *-* ]]; then
            REL_FLAG="--prerelease"
          else
            REL_FLAG="--latest"
          fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" $REL_FLAG --title "Luma TV $TAG" --notes "Automated multi-platform release."
          gh release upload "$TAG" ./Luma-TV-Android-Universal.apk --clobber
