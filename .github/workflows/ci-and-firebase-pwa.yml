name: CI & Firebase PWA Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-and-build:
    name: Lint, Vitest & Production PWA Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Run oxlint static analysis
        run: npm run lint

      - name: Run Vitest unit & crypto test suite
        run: npm test

      - name: Build ChromeOS / Web PWA production bundle
        run: npm run build

      - name: Build Firebase Cloud Functions (CORS Stream Proxy)
        working-directory: functions
        run: npm install --no-audit --no-fund && npm run build

      - name: Upload PWA dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: luma-tv-pwa-dist
          path: dist/

      - name: Deploy PWA Hosting (when FIREBASE_SERVICE_ACCOUNT is configured)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.FIREBASE_SERVICE_ACCOUNT != ''
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: luma-tv-app
